name: e-wallet
services:
  db:
    image: postgres:14.6-alpine
    container_name: e-wallet-db
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_username}
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - ewallet_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ewallet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: e-wallet-backend:local
    container_name: e-wallet-backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${db_name}
      SPRING_DATASOURCE_USERNAME: ${db_username}
      SPRING_DATASOURCE_PASSWORD: ${db_password}
      # Provide override for JWT if needed
      JWT_SECRET: ${jwt_secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - ewallet_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://localhost:8080/api/v1
    image: e-wallet-frontend:local
    container_name: e-wallet-frontend
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - ewallet_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  ewallet_network:
    driver: bridge

volumes:
  ewallet_postgres_data:
    driver: local
